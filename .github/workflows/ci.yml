name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - run: pip install -e ".[dev]"

      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      # The suite needs no credentials: agents run on the stub provider and all
      # HTTP is either mocked or served in-process.
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t research-desk:ci .
      - name: Agent starts, reports healthy and enforces auth
        run: |
          docker run -d --name probe -p 8002:8002 \
            -e PORT=8002 -e ANALYST_MODEL=stub:ci -e A2A_API_KEY=ci-key \
            research-desk:ci serve analyst
          for _ in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8002/health > /dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8002/health | grep -q '"auth_required": *true'
          # The card must stay public, or discovery cannot bootstrap.
          curl -fsS http://127.0.0.1:8002/.well-known/agent-card.json | grep -q X-API-Key
          # And the protocol endpoint must refuse an unauthenticated call.
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8002/ \
            -H 'Content-Type: application/json' -H 'A2A-Version: 1.0' \
            -d '{"jsonrpc":"2.0","id":"1","method":"GetTask","params":{"id":"x"}}')
          test "$status" = "401" || { echo "expected 401, got $status"; docker logs probe; exit 1; }
